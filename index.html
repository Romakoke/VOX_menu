<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOX Lounge Bar | Digital Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <h1>Электронды меню</h1>
    <a href="#menu" class="hero-btn">Менюді көру</a>
  </div>
</header>

<section class="top-info">
  <p>Обслуживание +15%</p>
  <p>Добро пожаловать!</p>
</section>

<main id="menu" class="menu-section">
  <h2>VOX MENU</h2>
  <p class="subtitle">Категорияны таңдаңыз</p>

  <div class="menu-tabs">
    <button class="menu-tab active" data-type="kitchen">Кухня</button>
    <button class="menu-tab" data-type="bar">Бар</button>
  </div>

  <div class="categories" id="categories"></div>

  <div class="menu-grid" id="menuGrid"></div>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" id="closeModal">×</button>
    <img id="modalImg" src="" alt="">
    <h3 id="modalTitle"></h3>
    <p id="modalPrice"></p>
    <div class="ingredients">
      <b>Қоспасы:</b>
      <span id="modalIngredients"></span>
    </div>
  </div>
</div>

<footer>
  <div class="logo">VO<span>X</span></div>
  <p>Restobar • Karaoke • Lounge</p>

  <div class="footer-links">
    <a href="https://www.instagram.com/vox_lounge_bar/" target="_blank">Instagram</a>
    <a href="https://2gis.kz/shymkent/geo/70000001100353879" target="_blank">2GIS</a>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
